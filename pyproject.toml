[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "lukart_build_backend"
backend-path = ["."]

[project]
name = "lukart-ros"
version = "1.1.0.dev0"
description = "LukArt ROS – Knowledge Operating System and virtual chambers factory"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
  { name = "LukArt" }
]

dependencies = [
  "PyYAML>=6.0",
  "langdetect>=1.0.9",
  "python-docx>=1.1",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.lukart.enterprise]
release_enabled = false
immutable_releases_required = true
immutable_baseline_version = "1.0.1"
immutable_baseline_commit = "802013c4d0e53dc12306a97e1877ebba86af64a7"

[tool.setuptools.packages.find]
include = [
  "agents*",
  "core*",
  "factory*",
  "knowledge*",
  "learning*",
  "reasoning*",
  "renderer*",
  "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
check_untyped_defs = true
exclude = "^(build|dist|.*\\.egg-info|validation/test_graph\\.py)(/|$)"

[[tool.mypy.overrides]]
module = [
  "core.artifact_escrow_v1",
  "core.case_exchange_v1",
  "core.case_exchange_v2",
  "core.case_ledger.contracts",
  "core.case_ledger.ledger",
  "core.case_replay_v2",
  "core.critical_invariants",
  "core.durable_escrow_v1",
  "core.enterprise.api_guard",
  "core.enterprise.authorization",
  "core.enterprise.authorization_policy",
  "core.enterprise.contracts",
  "core.enterprise.durability",
  "core.enterprise.operational_readiness_v1",
  "core.evaluation.contracts",
  "core.governance_closure_v1",
  "core.long_range_drift_v1",
  "core.long_range_health_v1",
  "core.long_range_replay_v1",
  "core.lrd_replay_closure_v1",
  "core.offline_long_range_survivability_v1",
  "core.offline_survivability_verifier_v1",
  "core.p3.contracts",
  "core.p3.versioning",
  "core.periodic_replay_revalidation_v1",
  "core.post_quantum_readiness_v1",
  "core.product_runtime_v1",
  "core.product_verification_evidence_v1",
  "core.provider_durable_evidence_bundle_v1",
  "core.provider_durable_storage_v1",
  "core.replay_revalidation_baseline_lineage_v1",
  "core.replay_revalidation_baseline_selection_v1",
  "core.replay_revalidation_baseline_transition_v1",
  "core.replay_revalidation_baseline_v1",
  "core.replay_revalidation_fulfilment_v1",
  "core.replay_revalidation_invalidation_v1",
  "core.semantic_change_v2",
  "knowledge.epistemic",
  "knowledge.epistemic_assertions",
  "knowledge.evidence_trust_graph",
  "validation.gold_kqm_v2",
  "validation.release_contract",
  "validation.release_governance",
  "validation.release_manifest",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.lang_detect_exception"]
ignore_missing_imports = true