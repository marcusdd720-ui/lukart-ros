[project]
name = "lukart-ros"
version = "0.1.0"
description = "LukArt ROS – Knowledge Operating System and virtual chambers factory"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LukArt" }
]

dependencies = [
  "PyYAML>=6.0",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = [
  "core*",
  "factory*",
  "knowledge*",
  "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
exclude = "^(build|dist|.*\\.egg-info)(/|$)"
