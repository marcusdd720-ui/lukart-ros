[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lukart-ros"
version = "0.1.0"
description = "LukArt ROS – Knowledge Operating System and virtual chambers factory"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LukArt" }
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "knowledge*", "factory*", "canon*", "validation*"]
exclude = ["tests*", "cases*", "output*", "reports*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["core", "knowledge", "factory", "canon", "validation", "scripts"]
exclude = [
  "^tests/",
  "^cases/",
  "^output/",
  "^reports/",
  "^docs/",
]
show_error_codes = true
pretty = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
warn_unused_configs = true
