[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "lukart_build_backend"
backend-path = ["."]

[project]
name = "lukart-ros"
version = "1.1.0.dev0"
description = "LukArt ROS – Knowledge Operating System and virtual chambers factory"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
  { name = "LukArt" }
]

dependencies = [
  "PyYAML>=6.0",
  "langdetect>=1.0.9",
  "python-docx>=1.1",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.lukart.enterprise]
release_enabled = false
immutable_baseline_version = "1.0.1"
immutable_baseline_commit = "802013c4d0e53dc12306a97e1877ebba86af64a7"

[tool.setuptools.packages.find]
include = [
  "agents*",
  "core*",
  "factory*",
  "knowledge*",
  "learning*",
  "reasoning*",
  "renderer*",
  "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
exclude = "^(build|dist|.*\\.egg-info|validation/test_graph\\.py)(/|$)"

[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.lang_detect_exception"]
ignore_missing_imports = true
