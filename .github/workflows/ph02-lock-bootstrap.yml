name: PH-02 Lock Bootstrap

on:
  push:
    branches: [post-hardcore/ph-02-build-identity-v3]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: post-hardcore/ph-02-build-identity-v3
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"
      - name: Resolve canonical lock and derived PEP 751 lock
        run: |
          uv lock
          uv export --format pylock.toml --frozen --all-extras --output-file pylock.toml
      - name: Commit generated lock artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock pylock.toml
          git diff --cached --exit-code && exit 0
          git commit -m "PH-02: generate canonical dependency locks"
          git push origin HEAD:post-hardcore/ph-02-build-identity-v3
