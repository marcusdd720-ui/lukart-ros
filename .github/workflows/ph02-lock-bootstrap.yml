name: PH-02 Compatibility Migration

on:
  push:
    branches: [post-hardcore/ph-02-build-identity-v3]

permissions:
  contents: write

jobs:
  migrate-compatibility:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: post-hardcore/ph-02-build-identity-v3
      - name: Apply deterministic compatibility migration
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path('core/p3/contracts.py')
          text = contracts.read_text(encoding='utf-8')
          old = '''    @property
    def complete_for_replay(self) -> bool:
        return self.identity_schema == RUNTIME_IDENTITY_V3 and all(
            (
                self.provider_inventory_declared,
                self.plugin_inventory_declared,
                self.input_inventory_declared,
                self.evidence_inventory_declared,
                self.execution_environment_declared,
            )
        )

    def incomplete_fields(self) -> tuple[str, ...]:
        flags = {
            "provider_identities": self.provider_inventory_declared,
            "plugin_identities": self.plugin_inventory_declared,
            "input_digests": self.input_inventory_declared,
            "evidence_digests": self.evidence_inventory_declared,
            "execution_environment": (
                self.identity_schema == RUNTIME_IDENTITY_V3
                and self.execution_environment_declared
            ),
        }
        return tuple(sorted(name for name, declared in flags.items() if not declared))
'''
          new = '''    @property
    def complete_for_replay(self) -> bool:
        legacy_complete = all(
            (
                self.provider_inventory_declared,
                self.plugin_inventory_declared,
                self.input_inventory_declared,
                self.evidence_inventory_declared,
            )
        )
        if self.identity_schema == RUNTIME_IDENTITY_V2:
            return legacy_complete
        return legacy_complete and self.execution_environment_declared

    def incomplete_fields(self) -> tuple[str, ...]:
        flags = {
            "provider_identities": self.provider_inventory_declared,
            "plugin_identities": self.plugin_inventory_declared,
            "input_digests": self.input_inventory_declared,
            "evidence_digests": self.evidence_inventory_declared,
        }
        if self.identity_schema == RUNTIME_IDENTITY_V3:
            flags["execution_environment"] = self.execution_environment_declared
        return tuple(sorted(name for name, declared in flags.items() if not declared))
'''
          if old not in text:
              raise SystemExit('RuntimeIdentity compatibility block not found')
          contracts.write_text(text.replace(old, new), encoding='utf-8')

          h5 = Path('scripts/hardcore_h5_replay.py')
          text = h5.read_text(encoding='utf-8')
          marker = '        evidence_inventory_declared=True,\n    )'
          replacement = (
              '        evidence_inventory_declared=True,\n'
              '        identity_schema="lukart.runtime-identity.v2",\n'
              '    )'
          )
          if marker not in text:
              raise SystemExit('H5 complete identity marker not found')
          text = text.replace(marker, replacement, 1)
          marker = '        corpus_digest=content_digest({"corpus": "h5"}),\n    )'
          replacement = (
              '        corpus_digest=content_digest({"corpus": "h5"}),\n'
              '        identity_schema="lukart.runtime-identity.v2",\n'
              '    )'
          )
          if marker not in text:
              raise SystemExit('H5 partial identity marker not found')
          h5.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          test = Path('tests/test_post_hardcore_ph02.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'def test_ph02_v2_remains_readable_but_never_complete_for_v3_replay() -> None:',
              'def test_ph02_v2_remains_readable_under_legacy_contract() -> None:',
          )
          text = text.replace(
              '    assert not legacy.complete_for_replay\n'
              '    assert "execution_environment" in legacy.incomplete_fields()\n',
              '    assert not legacy.complete_for_replay\n'
              '    assert "execution_environment" not in legacy.incomplete_fields()\n',
          )
          test.write_text(text, encoding='utf-8')
          PY
      - name: Commit compatibility migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/p3/contracts.py scripts/hardcore_h5_replay.py tests/test_post_hardcore_ph02.py
          git diff --cached --exit-code && exit 0
          git commit -m "PH-02: preserve explicit v2 replay compatibility"
          git push origin HEAD:post-hardcore/ph-02-build-identity-v3
