name: Stage Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage number (0-16)"
        required: true
        default: "5"
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Resolve stage
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage || '' }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "stage=0" >> "${GITHUB_OUTPUT}"
          else
            echo "stage=${INPUT_STAGE}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run selected stage gate
        run: python -m factory.stage_gate --stage "${{ steps.stage.outputs.stage }}"
      - name: Enterprise adversarial gate
        run: pytest -q tests/test_enterprise_track.py
      - name: Enterprise supply-chain gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.enterprise.supply_chain import audit_workflow_action_pins

          report = audit_workflow_action_pins(Path('.'))
          for finding in report.findings:
              print(f"UNPINNED {finding.path}: {finding.reference}")
          if not report.passed:
              raise SystemExit(1)
          print("ENTERPRISE_SUPPLY_CHAIN=PASS")
          PY
      - name: GitHub Actions Node24 runtime gate
        run: python scripts/github_actions_runtime_gate.py
