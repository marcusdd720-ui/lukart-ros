name: Stage Gate

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage number (0-16)"
        required: true
        default: "5"
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run selected stage gate
        run: python -m factory.stage_gate --stage "${{ inputs.stage }}"
