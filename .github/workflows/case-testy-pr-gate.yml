name: CASE-TESTY PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  case-testy-pr-gate:
    name: case-testy-pr-gate
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"
      - name: Frozen dependency sync
        run: uv sync --frozen --extra dev
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Validate canonical CASE regression SOT
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --validate-only
      - name: Run FAST profile
        continue-on-error: true
        run: |
          mkdir -p case-testy-reports
          uv run --frozen --extra dev python -m factory.quality.test_profiles FAST \
            --sha "$HEAD_SHA" --verify-head --output case-testy-reports/fast.json
      - name: Run PR profile
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.test_profiles PR \
            --sha "$HEAD_SHA" --verify-head --output case-testy-reports/pr.json
      - name: Run FULL profile
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.test_profiles FULL \
            --sha "$HEAD_SHA" --verify-head --output case-testy-reports/full.json
      - name: Run canonical CASE regression batch
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --output case-testy-reports/canonical-batch.json
      - name: Validate required reports
        if: always()
        run: |
          status=0
          for spec in "FAST:fast.json" "PR:pr.json" "FULL:full.json"; do
            profile="${spec%%:*}"
            file="${spec#*:}"
            if ! uv run --frozen --extra dev python -m factory.quality.test_report \
              "case-testy-reports/$file" --profile "$profile" --sha "$HEAD_SHA"; then
              status=1
            fi
          done
          exit "$status"
      - name: Validate canonical batch completeness
        if: always()
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --verify-report case-testy-reports/canonical-batch.json
      - name: Upload CASE-TESTY evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: case-testy-pr-${{ github.event.pull_request.head.sha }}
          path: case-testy-reports/*.json
          if-no-files-found: error
          retention-days: 30
