name: GitHub App Smoke Test

on:
  push:
    branches:
      - main
      - 'stage-*'
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to dispatch through GitHub App"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  STAGE: ${{ inputs.stage || '' }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Resolve stage
        run: |
          if [ -z "$STAGE" ]; then
            STAGE="$(python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("factory/stage_state.json").read_text(encoding="utf-8"))
          print(state["current_stage"])
          PY
            )"
            echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          fi
          echo "RESOLVED_STAGE=$STAGE"

      - name: Authenticate GitHub App and dispatch stage
        env:
          LUKART_ROS_FACTORY_APP_ID: ${{ vars.LUKART_ROS_FACTORY_APP_ID }}
          LUKART_ROS_FACTORY_CLIENT_ID: ${{ vars.LUKART_ROS_FACTORY_CLIENT_ID }}
          LUKART_ROS_FACTORY_PRIVATE_KEY: ${{ secrets.LUKART_ROS_FACTORY_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os

          from factory.github_actions_client import GitHubActionsClient, GitHubActionsError

          stage = int(os.environ["STAGE"])
          try:
              client = GitHubActionsClient.from_environment()
              run_id = client.dispatch_stage_and_find_run(stage)
              result = client.wait_for_run(run_id)
          except (GitHubActionsError, ValueError) as exc:
              print(f"GitHub App smoke test failed: {exc}")
              raise SystemExit(1) from exc

          print("APP_AUTH=PASS")
          print(f"DISPATCHED_STAGE={stage}")
          print(f"RUN_ID={result.run_id}")
          print(f"RUN_STATUS={result.status}")
          print(f"RUN_CONCLUSION={result.conclusion}")
          print(f"RUN_URL={result.html_url}")

          if result.conclusion != "success":
              raise SystemExit(1)
          PY
