name: LRD-01G External Durable Escrow Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lrd01g-durable-escrow:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation environment
        run: python -m pip install -e ".[dev]"

      - name: Verify exact checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01G_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01G lint and strict type-check
        run: |
          ruff check core/durable_escrow_v1.py tests/test_durable_escrow_v1.py
          mypy core/durable_escrow_v1.py tests/test_durable_escrow_v1.py

      - name: LRD-01G focused and adversarial suite
        run: pytest -q tests/test_durable_escrow_v1.py

      - name: Escrow recovery health drift PQC regression
        run: |
          pytest -q \
            tests/test_durable_escrow_v1.py \
            tests/test_artifact_escrow_v1.py \
            tests/test_recovery_continuity_v1.py \
            tests/test_long_range_health_v1.py \
            tests/test_long_range_drift_v1.py \
            tests/test_post_quantum_readiness_v1.py

      - name: Durable escrow fail-closed adversarial selection
        run: |
          pytest -q tests/test_durable_escrow_v1.py \
            -k "location or failure or credential or tamper or missing or claim or unknown or substitution or destroyed"
