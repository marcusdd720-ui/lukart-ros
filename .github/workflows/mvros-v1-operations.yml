name: MVROS v1 Operations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-mvros-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install MVROS v1
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run MVROS v1 on non-sensitive fixture only
        run: python scripts/mvros_v1.py --root tests/fixtures/mvros_v1

      - name: Privacy boundary
        run: |
          echo "GitHub Actions processes only repository-owned synthetic fixture data."
          echo "Real case documents must be processed locally outside the Git repository."
