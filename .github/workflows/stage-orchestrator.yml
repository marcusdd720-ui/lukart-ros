name: Stage Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to execute"
        required: false
        default: ""
        type: string

concurrency:
  group: lukart-ros-stage-orchestrator-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Validate orchestrator contract without lifecycle mutation
        run: python -m pytest tests/test_stage_orchestrator.py tests/test_stage_registry.py -q

  orchestrate-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "lukart-ros-factory[bot]"
          git config user.email "4804861+lukart-ros-factory[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Execute autonomous lifecycle controller
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_INPUT: ${{ inputs.stage || '' }}
        run: python -m factory.stage_orchestrator --stage "${STAGE_INPUT}"
