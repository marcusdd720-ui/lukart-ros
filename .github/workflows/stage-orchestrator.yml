name: Stage Orchestrator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to execute"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lukart-ros-stage-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Execute autonomous lifecycle controller
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_INPUT: ${{ inputs.stage || '' }}
        run: python -m factory.stage_orchestrator --stage "${STAGE_INPUT}"
