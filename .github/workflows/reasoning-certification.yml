name: Reasoning Locked Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/quality/reasoning_certification_policy_v1.json"
      - "docs/quality/reviews/reasoning_gold_v2_review.json"
      - "data/quality/reasoning_gold_v2.json"
      - "data/quality/reasoning_gold_v2.freeze.json"
      - "reports/production_validation/step_06.json"
      - "factory/production_validation_evidence/step_06.json"
      - "validation/reasoning_certification.py"
      - "certification_tests/test_step6_locked_certification.py"
      - ".github/workflows/reasoning-certification.yml"
  workflow_dispatch:

jobs:
  step6-locked-certification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Execute certification-only locked evaluation
        run: >-
          python -m pytest
          certification_tests/test_step6_locked_certification.py
          -q
