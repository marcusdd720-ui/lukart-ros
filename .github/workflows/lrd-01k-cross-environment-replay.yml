name: LRD-01K Cross-Environment Replay

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-environment:
    name: environment-${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-py311
            os: ubuntu-latest
            python-version: "3.11"
          - profile: linux-py314
            os: ubuntu-latest
            python-version: "3.14"
          - profile: windows-py314
            os: windows-latest
            python-version: "3.14"
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "17"
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --extra dev

      - name: Verify exact checkout
        shell: python
        run: |
          import os
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["CANDIDATE_SHA"]:
              raise SystemExit(f"candidate checkout mismatch: {head}")

      - name: LRD-01K lint and strict type-check
        run: |
          uv run --frozen --extra dev ruff check core/cross_environment_replay_v1.py core/cross_environment_replay_verifier_v1.py scripts/lrd01k_environment_canary.py scripts/lrd01k_aggregate_canary.py scripts/lrd01k_oci_inspect.py tests/test_cross_environment_replay_v1.py
          uv run --frozen --extra dev mypy --strict core/cross_environment_replay_v1.py core/cross_environment_replay_verifier_v1.py scripts/lrd01k_environment_canary.py scripts/lrd01k_aggregate_canary.py scripts/lrd01k_oci_inspect.py

      - name: Focused and adversarial LRD-01K suite
        run: uv run --frozen --extra dev pytest -q tests/test_cross_environment_replay_v1.py

      - name: LRD-01D semantic authority regression
        run: uv run --frozen --extra dev pytest -q tests/test_long_range_drift_v1.py

      - name: LRD-01I and SSC-02 regression
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_offline_long_range_survivability_v1.py
          tests/test_supply_chain_continuity_v2.py
          tests/test_cross_algorithm_crypto_migration_v1.py
          tests/test_case_replay_v2.py
          tests/test_private_ocr_replay_v1.py

      - name: Capture actual observed environment provenance
        run: >-
          uv run --frozen --extra dev python scripts/lrd01k_environment_canary.py
          --name "${{ matrix.profile }}"
          --output "_lrd01k/${{ matrix.profile }}.json"

      - name: Upload immutable matrix component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lrd01k-${{ matrix.profile }}
          path: _lrd01k/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate-matrix:
    name: aggregate-cross-environment-matrix
    needs: cross-environment
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download environment receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lrd01k-*
          path: _matrix
          merge-multiple: true

      - name: Aggregate complete three-profile matrix
        shell: bash
        run: |
          mapfile -t inputs < <(find _matrix -maxdepth 1 -type f -name '*.json' -print | sort)
          test "${#inputs[@]}" -eq 3
          python scripts/lrd01k_aggregate_canary.py "${inputs[@]}" --output _lrd01k/report.json
          python core/cross_environment_replay_verifier_v1.py _lrd01k/report.json

      - name: Upload aggregate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lrd01k-aggregate-report
          path: _lrd01k/report.json
          if-no-files-found: error
          retention-days: 7

  frozen-oci-capsule:
    name: frozen-oci-capsule-offline-execution
    needs: aggregate-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download aggregate report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lrd01k-aggregate-report
          path: _aggregate

      - name: Build and execute frozen verifier capsule with network denied
        shell: bash
        run: |
          docker build --file scripts/lrd01k_capsule.Dockerfile --tag lrd01k-capsule:ci .
          expected="$(python -c 'import json; print(json.load(open("_aggregate/report.json"))["report_digest"])')"
          docker run --rm --network none \
            --mount type=bind,src="$PWD/_aggregate",dst=/evidence,readonly \
            lrd01k-capsule:ci /evidence/report.json --expected-digest "$expected"

      - name: Materialize and verify content-addressed OCI Image Layout
        shell: bash
        run: |
          mkdir -p _lrd01k/oci
          docker buildx build \
            --file scripts/lrd01k_capsule.Dockerfile \
            --output type=oci,dest=_lrd01k/capsule.tar .
          tar -xf _lrd01k/capsule.tar -C _lrd01k/oci
          bundle="$(python -c 'import json; print(json.load(open("_aggregate/report.json"))["plan"]["lrd01i_bundle_digest"])')"
          dependency="$(python -c 'import json; print(json.load(open("_aggregate/report.json"))["plan"]["ssc02_manifest_digest"])')"
          verifier="$(python -c 'import json; d=json.load(open("_aggregate/report.json")); ref=d["plan"]["reference_profile_digest"]; print(next(p["replay_verifier_digest"] for p in d["profiles"] if p["profile_digest"] == ref))')"
          python scripts/lrd01k_oci_inspect.py _lrd01k/oci \
            --source-bundle-digest "$bundle" \
            --dependency-identity-digest "$dependency" \
            --verifier-digest "$verifier" \
            --output _lrd01k/oci-capsule-identity.json

      - name: Explicit capsule non-claims
        run: |
          echo "OCI_IS_ETERNAL_MACHINE=false"
          echo "HOST_KERNEL_RUNTIME_CPU_DEPENDENCY_REMAINS=true"
          echo "MUTABLE_IMAGE_TAG_IS_IDENTITY_AUTHORITY=false"
          echo "ARM64_PROVEN=false"
          echo "MACOS_PROVEN=false"
          echo "BARE_METAL_PORTABILITY_PROVEN=false"

  policy-boundary:
    name: lrd01k-authority-boundary
    runs-on: ubuntu-latest
    steps:
      - name: No authority promotion
        run: |
          echo "CCL_WRITE_AUTHORITY=false"
          echo "PRODUCT_WRITE_AUTHORITY=false"
          echo "GOLD_AUTHORITY=false"
          echo "POLICY_PROMOTION_AUTHORITY=false"
          echo "TRUST_ROOT_PROMOTION_AUTHORITY=false"
          echo "RELEASE_TAG_AUTHORITY=false"
          echo "CLOUD_CREDENTIALS_REQUIRED=false"
          echo "AWS_EVIDENCE_CLAIM=false"
          echo "SEMANTIC_COMPARISON_AUTHORITY=LRD-01D"
