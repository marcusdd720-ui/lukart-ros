name: CASE-OPS-06 Private Local Pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-ops-06-private-pilot:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation environment
        run: python -m pip install -e ".[dev]"

      - name: Verify exact checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "CASE_OPS_06_EXACT_SHA=${CANDIDATE_SHA}"

      - name: Focused lint and type-check
        run: |
          ruff check \
            core/private_case_pilot_v1.py \
            scripts/private_case_pilot.py \
            tests/test_private_case_pilot_v1.py
          mypy core/private_case_pilot_v1.py scripts/private_case_pilot.py

      - name: Focused and adversarial private pilot tests
        run: pytest -q tests/test_private_case_pilot_v1.py

      - name: Product and private-evidence regression
        run: |
          pytest -q \
            tests/test_private_evidence_v1.py \
            tests/test_private_evidence_derivation_v1.py \
            tests/test_private_case_runtime_bridge_v1.py \
            tests/test_private_evidence_recovery_v1.py \
            tests/test_private_evidence_recovery_set_v1.py \
            tests/test_private_evidence_recovery_ops_v1.py \
            tests/test_product_runtime_v1.py \
            tests/test_case_replay_v2.py \
            tests/test_private_case_pilot_v1.py

      - name: Private pilot CLI surface smoke
        run: python scripts/private_case_pilot.py --help >/dev/null

      - name: Public CI boundary
        run: |
          echo "REAL_CASE_DATA_IN_PUBLIC_CI=false"
          echo "PRIVATE_KEY_IN_PUBLIC_CI=false"
          echo "REAL_PRIVATE_CASE_PILOT_CLAIMED=false"
          echo "SUBSTANTIVE_CASE_REASONING_CLAIMED=false"
          echo "INDEPENDENT_REVIEW_CLAIMED=false"
          echo "CLOUD_PROVIDER_REQUIRED=false"
