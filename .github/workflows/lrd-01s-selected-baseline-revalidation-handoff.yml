name: LRD-01S Selected Baseline Revalidation Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - "core/replay_revalidation_selected_handoff_v1.py"
      - "core/replay_revalidation_invalidation_v1.py"
      - "core/replay_revalidation_fulfilment_v1.py"
      - "core/replay_revalidation_baseline_transition_v1.py"
      - "core/replay_revalidation_baseline_lineage_v1.py"
      - "core/replay_revalidation_baseline_selection_v1.py"
      - "tests/test_replay_revalidation_selected_handoff_v1.py"
      - "tests/test_replay_revalidation_invalidation_v1.py"
      - "tests/test_replay_revalidation_fulfilment_v1.py"
      - "tests/test_replay_revalidation_baseline_transition_v1.py"
      - "tests/test_replay_revalidation_baseline_lineage_v1.py"
      - "tests/test_replay_revalidation_baseline_selection_v1.py"
      - "docs/LRD_01S_SELECTED_BASELINE_REVALIDATION_HANDOFF_V1.md"
      - "pyproject.toml"
      - ".github/workflows/lrd-01s-selected-baseline-revalidation-handoff.yml"
  push:
    branches: [main]
    paths:
      - "core/replay_revalidation_selected_handoff_v1.py"
      - "core/replay_revalidation_invalidation_v1.py"
      - "core/replay_revalidation_fulfilment_v1.py"
      - "core/replay_revalidation_baseline_transition_v1.py"
      - "core/replay_revalidation_baseline_lineage_v1.py"
      - "core/replay_revalidation_baseline_selection_v1.py"
      - "tests/test_replay_revalidation_selected_handoff_v1.py"
      - "tests/test_replay_revalidation_invalidation_v1.py"
      - "tests/test_replay_revalidation_fulfilment_v1.py"
      - "tests/test_replay_revalidation_baseline_transition_v1.py"
      - "tests/test_replay_revalidation_baseline_lineage_v1.py"
      - "tests/test_replay_revalidation_baseline_selection_v1.py"
      - "docs/LRD_01S_SELECTED_BASELINE_REVALIDATION_HANDOFF_V1.md"
      - "pyproject.toml"
      - ".github/workflows/lrd-01s-selected-baseline-revalidation-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  selected-baseline-handoff:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --all-extras

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: LRD-01S lint and strict type-check
        run: |
          uv run ruff check \
            core/replay_revalidation_selected_handoff_v1.py \
            tests/test_replay_revalidation_selected_handoff_v1.py
          uv run mypy core/replay_revalidation_selected_handoff_v1.py

      - name: LRD-01S focused handoff suite
        run: |
          uv run pytest -q tests/test_replay_revalidation_selected_handoff_v1.py \
            -k "missing_current_selection or unchanged_candidate or changed_without_replay or valid_replay_after_blocked_attempt or valid_replay_can_advance_directly or semantic_drift"

      - name: LRD-01S adversarial handoff suite
        run: |
          uv run pytest -q tests/test_replay_revalidation_selected_handoff_v1.py \
            -k "substitution or stale_source_race or duplicate_unchanged or tamper or authority or unrelated_provenance"

      - name: LRD-01S full handoff suite
        run: uv run pytest -q tests/test_replay_revalidation_selected_handoff_v1.py

      - name: Upstream replay-revalidation regression
        run: |
          uv run pytest -q \
            tests/test_replay_revalidation_baseline_selection_v1.py \
            tests/test_replay_revalidation_baseline_lineage_v1.py \
            tests/test_replay_revalidation_baseline_transition_v1.py \
            tests/test_replay_revalidation_fulfilment_v1.py \
            tests/test_replay_revalidation_invalidation_v1.py

      - name: Verify authority boundaries remain scoped
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -nE '^  schedule:|^    schedule:' .github/workflows/lrd-01s-selected-baseline-revalidation-handoff.yml || true)"
          test -z "$(grep -nE 'contents:[[:space:]]*write|actions:[[:space:]]*write|packages:[[:space:]]*write' .github/workflows/lrd-01s-selected-baseline-revalidation-handoff.yml || true)"
          grep -q '"selection_persistence_authority": True' core/replay_revalidation_selected_handoff_v1.py
          for marker in \
            automatic_replay_authority \
            scheduler_authority \
            workflow_dispatch_authority \
            mutable_pointer_authority \
            release_authority \
            product_write_authority \
            ccl_write_authority \
            storage_authority \
            provider_authority
          do
            grep -q "\"$marker\": False" core/replay_revalidation_selected_handoff_v1.py
            test -z "$(grep -n "\"$marker\": True" core/replay_revalidation_selected_handoff_v1.py || true)"
          done
          test -z "$(grep -nE '(^|[^A-Za-z])(boto3|botocore|azure\.storage|google\.cloud\.storage)([^A-Za-z]|$)' core/replay_revalidation_selected_handoff_v1.py || true)"
