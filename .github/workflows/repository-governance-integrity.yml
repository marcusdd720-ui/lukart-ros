name: Repository Governance Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-integrity:
    name: governance-integrity
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate live ruleset and required-check integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/hardcore_h2_policy.py --candidate-sha "$CANDIDATE_SHA"
