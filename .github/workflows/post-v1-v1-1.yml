name: Post-v1 v1.1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-fast-gates:
    name: PR fast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the scoped Groq broker branches validate the published PR HEAD,
          # not GitHub's synthetic merge. Other PRs retain existing behaviour.
          ref: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'night-shift/groq-broker-') && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Require GitHub Verified identity for all Groq PR commits
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'night-shift/groq-broker-') }}
        shell: bash
        env:
          ROS_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          ROS_PR_NUMBER: ${{ github.event.pull_request.number }}
          ROS_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["ROS_REPOSITORY"]
          number = int(os.environ["ROS_PR_NUMBER"])
          sha = os.environ["ROS_EXPECTED_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pulls/{number}/commits?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              commits = json.load(response)
          if (not isinstance(commits, list) or not commits or len(commits) >= 100
                  or commits[-1].get("sha") != sha):
              raise SystemExit("GITHUB_SIGNED_PR_FAIL: incomplete exact-head commit list")
          email = "265352475+marcusdd720-ui@users.noreply.github.com"
          for commit in commits:
              meta = commit.get("commit") or {}
              signature = meta.get("verification") or {}
              author = (meta.get("author") or {}).get("email")
              committer = (meta.get("committer") or {}).get("email")
              if (signature.get("verified") is not True
                      or signature.get("reason") != "valid"
                      or author != email or committer != email):
                  raise SystemExit(
                      "GITHUB_SIGNED_PR_FAIL: unverified commit or account identity: "
                      + str(commit.get("sha", "UNKNOWN"))
                  )
          print(f"GITHUB_VERIFIED_ALL_PR_COMMITS={len(commits)}; EXACT_HEAD={sha}")
          PY
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy agents core factory knowledge learning reasoning renderer validation
      - name: Unit and invariant suite
        run: pytest -q
      - name: Post-v1 focused integration
        run: pytest -q tests/test_post_v1_certification.py
      - name: Night Shift Linux Bubblewrap Git metadata kernel proof (no secrets)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'night-shift/groq-broker-') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
          echo "BWRAP_VERSION=$(bwrap --version)"
          echo "KERNEL_VERSION=$(uname -r)"
          echo "EXACT_PR_HEAD=${{ github.event.pull_request.head.sha }}"
          # This single focused test must execute an actual Linux mount namespace.
          # Any unavailable namespace or denied sandbox is a FAIL, not a skipped PASS.
          ROS_REQUIRE_BWRAP_PROOF=1 pytest -q tests/test_night_shift_git_metadata_isolation.py::test_linux_bwrap_kernel_mount_isolation_if_available -rs
          echo "BWRAP_GIT_KERNEL_PROOF_PASS=true"

  night-shift-hosted-builder-pilot:
    name: Night Shift rootless Builder pilot (Ubuntu 22.04)
    if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'night-shift/groq-broker-') }}
    # Ubuntu 24.04 hosted runner denied rootless bwrap network setup.
    # Preserve the exact sandbox policy; verify a separate supported Linux host.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Real rootless Bubblewrap / Unix broker / receipt (synthetic only)
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
          echo "ROS_BUILDER_PILOT_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "ROS_BUILDER_PILOT_KERNEL=$(uname -r)"
          echo "ROS_BUILDER_PILOT_BWRAP=$(bwrap --version)"
          ROS_REQUIRE_HOSTED_BUILDER_PILOT=1 pytest -q -s tests/test_night_shift_groq_builder_hosted_pilot.py::test_hosted_real_scoped_builder_bridge_and_receipt
          echo "ROS_HOSTED_BUILDER_STAGE_PASS=true"

  release-certification:
    name: Release certification evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: pr-fast-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Gold and cognitive E2E
        run: |
          pytest -q tests/test_post_v1_certification.py
          pytest -q
      - name: Replay, provenance, KQM, security policy checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root/'data/quality/post_v1_gold_v1_1.manifest.json').read_text())
          kqm = json.loads((root/'config/post_v1_kqm_v1_1.json').read_text())
          policy = json.loads((root/'config/post_v1_certification_v1_1.json').read_text())
          assert manifest['locked_evaluation_policy'] == 'certification_only_no_tuning'
          assert kqm['policy']['missing_metric'] == 'FAIL'
          assert policy['security_privacy']['public_repo_pii'] == 'FATAL'
          assert policy['controlled_learning']['direct_candidate_to_fact'] is False
          assert policy['self_healing']['locked_gold_mutable'] is False
          print('post-v1 policy contracts: PASS')
          PY
      - name: Performance measurement
        run: python scripts/post_v1_metrics.py | tee post-v1-performance.json
      - name: Build evidence bundle metadata
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.')
          files = {
            'gold_manifest': 'data/quality/post_v1_gold_v1_1.manifest.json',
            'kqm_policy': 'config/post_v1_kqm_v1_1.json',
            'certification_policy': 'config/post_v1_certification_v1_1.json',
            'performance': 'post-v1-performance.json',
          }
          evidence = {
            'schema': 'lukart.release-evidence.v1',
            'candidate_sha': os.environ['CANDIDATE_SHA'],
            'roadmap': 'v1.1',
            'artifacts': {},
          }
          for name, path in files.items():
            raw = (root/path).read_bytes()
            evidence['artifacts'][name] = {
              'path': path,
              'sha256': hashlib.sha256(raw).hexdigest(),
            }
          Path('post-v1-release-evidence.json').write_text(
            json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-v1-v1.1-evidence-${{ github.sha }}
          path: |
            post-v1-performance.json
            post-v1-release-evidence.json
          if-no-files-found: error
          retention-days: 30
