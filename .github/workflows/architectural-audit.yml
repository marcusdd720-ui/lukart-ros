name: Architectural Audit 1.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run A1-A25 audit
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/architectural-audit"
          python scripts/architectural_audit_final.py --output-dir "$OUTPUT_DIR"
          echo "AUDIT_REPORT_START"
          cat "$OUTPUT_DIR/audit-report.md"
          echo "AUDIT_REPORT_END"
      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architectural-audit-report
          path: ${{ runner.temp }}/architectural-audit/
