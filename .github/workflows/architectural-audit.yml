name: Architectural Audit 1.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv and frozen environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev
      - name: Run A1-A25 audit
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/architectural-audit"
          uv run --frozen --extra dev python scripts/architectural_audit_final.py --output-dir "$OUTPUT_DIR"
          echo "AUDIT_REPORT_START"
          cat "$OUTPUT_DIR/audit-report.md"
          echo "AUDIT_REPORT_END"
      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architectural-audit-report
          path: ${{ runner.temp }}/architectural-audit/
