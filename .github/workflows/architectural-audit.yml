name: Architectural Audit 1.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run A1-A25 audit
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/architectural-audit"
          python scripts/architectural_audit_final.py --output-dir "$OUTPUT_DIR"
          echo "AUDIT_REPORT_START"
          cat "$OUTPUT_DIR/audit-report.md"
          echo "AUDIT_REPORT_END"
      - name: Upload audit report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: architectural-audit-report
          path: ${{ runner.temp }}/architectural-audit/
