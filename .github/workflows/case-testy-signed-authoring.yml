name: CASE-TESTY Signed Authoring

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  signed-authoring:
    if: >-
      github.event.issue.number == 296 &&
      github.event.comment.body == '/case-testy-author harden_manual_smoke_inventory' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install frozen validation environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev

      - name: Prepare and validate without write credentials
        run: |
          uv run --frozen --extra dev python \
            -m factory.quality.case_signed_authoring_hardened \
            prepare \
            --manifest "${RUNNER_TEMP}/case-authoring-manifest.json"

      - name: Publish immutable validated bytes
        env:
          LUKART_ROS_FACTORY_APP_ID: ${{ vars.LUKART_ROS_FACTORY_APP_ID }}
          LUKART_ROS_FACTORY_CLIENT_ID: ${{ vars.LUKART_ROS_FACTORY_CLIENT_ID }}
          LUKART_ROS_FACTORY_PRIVATE_KEY: ${{ secrets.LUKART_ROS_FACTORY_PRIVATE_KEY }}
        run: |
          uv run --frozen --extra dev python \
            -m factory.quality.case_signed_authoring_hardened \
            publish \
            --manifest "${RUNNER_TEMP}/case-authoring-manifest.json"