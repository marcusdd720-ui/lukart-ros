name: P2 Semantic Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint P2
        run: ruff check core/p2 tests/test_p2_program.py
      - name: Type-check P2
        run: mypy core/p2
      - name: P2 focused suite
        run: pytest -q tests/test_p2_program.py
      - name: Full regression suite
        run: pytest -q
      - name: Policy integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('config/p2_v2.json').read_text())
          assert policy['gold_candidate_discovery']['automatic_promotion'] is False
          assert policy['semantic_regression']['critical_change_requires_review'] is True
          assert policy['agent_runtime_v2']['bounded_execution'] is True
          assert policy['plugins']['registry_stores_classes_not_instances'] is True
          print('P2 policy integrity: PASS')
          PY
