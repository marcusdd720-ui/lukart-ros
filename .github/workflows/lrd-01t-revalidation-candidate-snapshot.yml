name: LRD-01T Revalidation Candidate Snapshot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-snapshot:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "17"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --extra dev

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01T_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01T lint and strict type-check
        run: |
          uv run --frozen --extra dev ruff check \
            core/replay_revalidation_candidate_snapshot_v1.py \
            tests/test_replay_revalidation_candidate_snapshot_v1.py
          uv run --frozen --extra dev mypy \
            core/replay_revalidation_candidate_snapshot_v1.py

      - name: LRD-01T focused candidate snapshot suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_candidate_snapshot_v1.py
          -k 'materializes or deterministic or normalizes or round_trip'

      - name: LRD-01T adversarial candidate snapshot suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_candidate_snapshot_v1.py
          -k 'rejects'

      - name: LRD-01T full candidate snapshot suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_candidate_snapshot_v1.py

      - name: Upstream revalidation contract regression
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_invalidation_v1.py
          tests/test_replay_revalidation_fulfilment_v1.py
          tests/test_replay_revalidation_operational_handoff_v1.py

      - name: Verify authority boundaries remain scoped
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/lrd-01t-revalidation-candidate-snapshot.yml").read_text()
          module = Path("core/replay_revalidation_candidate_snapshot_v1.py").read_text()
          workflow_lines = {line.strip() for line in workflow.splitlines()}
          if "schedule:" in workflow_lines:
              raise SystemExit("LRD-01T must not introduce scheduler authority")
          if "contents: write" in workflow_lines or "actions: write" in workflow_lines:
              raise SystemExit("LRD-01T workflow must remain read-only")
          required_properties = (
              "repository_change_detection_authority",
              "scheduler_authority",
              "replay_execution_authority",
              "provider_authority",
              "storage_authority",
              "mutable_pointer_authority",
              "product_write_authority",
              "ccl_write_authority",
              "release_authority",
          )
          for name in required_properties:
              if f"def {name}(" not in module:
                  raise SystemExit(f"missing authority boundary property: {name}")
          forbidden = (
              "boto3",
              "azure.storage",
              "google.cloud",
              "subprocess",
              "requests.",
              "schedule:",
              "cron:",
          )
          for marker in forbidden:
              if marker in module:
                  raise SystemExit(
                      f"forbidden discovery/execution authority marker in snapshot module: {marker}"
                  )
          print("LRD01T_AUTHORITY_BOUNDARY=PASS")
          PY
