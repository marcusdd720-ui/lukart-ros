name: Governance Closure PR Preparation

on:
  workflow_run:
    workflows:
      - MVROS v1 Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact implementation merge SHA to prepare closure evidence for"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare-closure-pr:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
      LUKART_ROS_FACTORY_APP_ID: ${{ vars.LUKART_ROS_FACTORY_APP_ID }}
      LUKART_ROS_FACTORY_CLIENT_ID: ${{ vars.LUKART_ROS_FACTORY_CLIENT_ID }}
      LUKART_ROS_FACTORY_PRIVATE_KEY: ${{ secrets.LUKART_ROS_FACTORY_PRIVATE_KEY }}
      LUKART_ROS_CLOSURE_PR_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install frozen validation environment
        run: |
          python -m pip install "uv==0.12.10"
          uv sync --frozen --extra dev

      - name: Prepare closure PR from live GitHub evidence
        run: |
          uv run --frozen --extra dev python -m factory.closure_preparation \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
