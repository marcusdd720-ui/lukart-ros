name: LRD-01S Revalidation Operational Handoff

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-handoff:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "17"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --extra dev

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01S_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01S lint and strict type-check
        run: |
          uv run --frozen --extra dev ruff check \
            core/replay_revalidation_operational_handoff_v1.py \
            tests/test_replay_revalidation_operational_handoff_v1.py
          uv run --frozen --extra dev mypy \
            core/replay_revalidation_operational_handoff_v1.py

      - name: LRD-01S focused handoff suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_operational_handoff_v1.py
          -k 'unchanged or without_replay or with_verified_replay'

      - name: LRD-01S adversarial handoff suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_operational_handoff_v1.py
          -k 'requires_existing or duplicate or substitution or authority'

      - name: LRD-01S full handoff suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_operational_handoff_v1.py

      - name: Upstream replay-revalidation regression
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_baseline_selection_v1.py
          tests/test_replay_revalidation_baseline_lineage_v1.py
          tests/test_replay_revalidation_baseline_transition_v1.py
          tests/test_replay_revalidation_baseline_v1.py
          tests/test_replay_revalidation_fulfilment_v1.py
          tests/test_replay_revalidation_fulfilment_adversarial_v1.py
          tests/test_replay_revalidation_invalidation_v1.py

      - name: Verify authority boundaries remain scoped
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/lrd-01s-revalidation-operational-handoff.yml").read_text()
          module = Path("core/replay_revalidation_operational_handoff_v1.py").read_text()
          workflow_lines = {line.strip() for line in workflow.splitlines()}
          if "schedule:" in workflow_lines:
              raise SystemExit("LRD-01S must not introduce scheduler authority")
          if "contents: write" in workflow_lines or "actions: write" in workflow_lines:
              raise SystemExit("LRD-01S workflow must remain read-only")
          required_properties = (
              "selection_persistence_authority",
              "scheduler_authority",
              "repository_change_detection_authority",
              "replay_execution_authority",
              "mutable_pointer_authority",
              "release_authority",
              "product_write_authority",
              "ccl_write_authority",
              "storage_authority",
              "provider_authority",
          )
          for name in required_properties:
              if f"def {name}(" not in module:
                  raise SystemExit(f"missing authority boundary property: {name}")
          forbidden = ("boto3", "azure.storage", "google.cloud", "schedule:", "cron:")
          for marker in forbidden:
              if marker in module:
                  raise SystemExit(f"forbidden authority marker in handoff module: {marker}")
          print("LRD01S_AUTHORITY_BOUNDARY=PASS")
          PY
