name: LRD-01L Periodic Replay Revalidation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  periodic-revalidation:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "17"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --extra dev

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01L_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01L lint and strict type-check
        run: |
          uv run --frozen --extra dev ruff check \
            core/periodic_replay_revalidation_v1.py \
            tests/test_periodic_replay_revalidation_v1.py
          uv run --frozen --extra dev mypy --strict \
            core/periodic_replay_revalidation_v1.py

      - name: LRD-01L focused and adversarial suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_periodic_replay_revalidation_v1.py

      - name: LRD-01E and LRD-01K authority regression
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_long_range_health_v1.py
          tests/test_cross_environment_replay_v1.py
          tests/test_long_range_drift_v1.py

      - name: Verify no scheduler authority was introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/lrd-01l-periodic-revalidation.yml").read_text()
          if "schedule:" in workflow:
              raise SystemExit("LRD-01L must not introduce an unapproved schedule trigger")
          module = Path("core/periodic_replay_revalidation_v1.py").read_text()
          if '"scheduler_authority": False' not in module:
              raise SystemExit("scheduler authority non-claim is missing")
          PY
