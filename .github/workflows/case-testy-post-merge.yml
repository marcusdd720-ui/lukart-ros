name: CASE-TESTY Post-Merge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  case-testy-post-merge:
    name: case-testy-post-merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact merged SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"
      - name: Frozen dependency sync
        run: uv sync --frozen --extra dev
      - name: Verify exact merged SHA
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Validate canonical CASE regression SOT
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --validate-only
      - name: Run POST-MERGE profile
        continue-on-error: true
        run: |
          mkdir -p case-testy-reports
          uv run --frozen --extra dev python -m factory.quality.test_profiles POST-MERGE \
            --sha "$HEAD_SHA" --output case-testy-reports/post-merge.json
      - name: Run canonical CASE regression batch
        continue-on-error: true
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --output case-testy-reports/canonical-batch.json
      - name: Validate POST-MERGE report
        if: always()
        run: |
          uv run --frozen --extra dev python -m factory.quality.test_report \
            case-testy-reports/post-merge.json --profile POST-MERGE --sha "$HEAD_SHA"
      - name: Validate canonical batch completeness
        if: always()
        run: |
          uv run --frozen --extra dev python -m factory.quality.case_regression_suite \
            --verify-report case-testy-reports/canonical-batch.json
      - name: Upload CASE-TESTY post-merge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: case-testy-post-merge-${{ github.sha }}
          path: case-testy-reports/*.json
          if-no-files-found: error
          retention-days: 30
