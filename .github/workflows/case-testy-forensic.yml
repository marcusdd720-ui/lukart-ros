name: CASE-TESTY Forensic

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  case-testy-forensic:
    name: case-testy-forensic
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"
      - name: Frozen dependency sync
        run: uv sync --frozen --extra dev
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Run FORENSIC profile
        continue-on-error: true
        run: |
          mkdir -p case-testy-reports
          uv run --frozen --extra dev python -m factory.quality.test_profiles FORENSIC \
            --sha "$HEAD_SHA" --verify-head --output case-testy-reports/forensic.json
      - name: Validate FORENSIC report
        if: always()
        run: |
          uv run --frozen --extra dev python -m factory.quality.test_report \
            case-testy-reports/forensic.json --profile FORENSIC --sha "$HEAD_SHA"
      - name: Upload CASE-TESTY forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: case-testy-forensic-${{ github.sha }}
          path: case-testy-reports/forensic.json
          if-no-files-found: error
          retention-days: 30
