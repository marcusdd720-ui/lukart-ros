name: Ontology Validation

on:
  push:
    paths:
      - "knowledge/**"
      - "tests/**"

  pull_request:
    paths:
      - "knowledge/**"
      - "tests/**"

jobs:
  validation:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy .

      - name: PyTest
        run: pytest -v