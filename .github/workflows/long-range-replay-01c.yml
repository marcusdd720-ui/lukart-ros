name: LRD-01C Artifact Escrow Offline Runner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lrd01c-artifact-escrow:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation environment
        run: python -m pip install -e ".[dev]"

      - name: Verify exact checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01C_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01C lint and strict type-check
        run: |
          ruff check core/artifact_escrow_v1.py tests/test_artifact_escrow_v1.py
          mypy core/artifact_escrow_v1.py tests/test_artifact_escrow_v1.py

      - name: LRD-01C focused and adversarial suite
        run: pytest -q tests/test_artifact_escrow_v1.py

      - name: LRD-01C security boundary regression
        run: |
          pytest -q \
            tests/test_artifact_escrow_v1.py \
            tests/test_enterprise_isolation.py \
            tests/test_long_range_replay_v1.py \
            tests/test_supply_chain_continuity_v2.py

      - name: Offline/tamper/restore adversarial selection
        run: |
          pytest -q tests/test_artifact_escrow_v1.py \
            -k "offline or tamper or traversal or symlink or decompression or alternate_storage"
