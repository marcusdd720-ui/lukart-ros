name: GOV-AUTO-01 One-Shot Closure Doc Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gov-auto-01-doc-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 182 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply bounded presentation-only repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          raw = "; machine evidence retains run ID `34239068144`"
          files = (
              Path("MASTER_PLAN.md"),
              Path("docs/POST_HARDCORE_ROADMAP.md"),
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(raw)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one raw run-ID prose copy, found {count}")
              path.write_text(text.replace(raw, ""), encoding="utf-8")

          workflow = Path(".github/workflows/gov-auto-01-doc-repair.yml")
          if not workflow.exists():
              raise SystemExit("one-shot workflow file missing before self-delete")
          workflow.unlink()
          PY
          git diff --check
          test "$(git diff --numstat -- MASTER_PLAN.md | awk '{print $1+$2}')" -eq 2
          test "$(git diff --numstat -- docs/POST_HARDCORE_ROADMAP.md | awk '{print $1+$2}')" -eq 2
          test ! -e .github/workflows/gov-auto-01-doc-repair.yml

      - name: Commit exact repair and self-delete
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_PLAN.md docs/POST_HARDCORE_ROADMAP.md .github/workflows/gov-auto-01-doc-repair.yml
          git diff --cached --check
          git commit -m "Fix GOV-AUTO-01 closure run ID presentation"
          git push origin "HEAD:${HEAD_REF}"
