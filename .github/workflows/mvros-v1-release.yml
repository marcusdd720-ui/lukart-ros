name: MVROS v1 Release

on:
  workflow_run:
    workflows:
      - GitHub App Smoke Test
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: mvros-v1-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify validated SHA is current main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          echo "VALIDATED_SHA=$VALIDATED_SHA"
          echo "CURRENT_MAIN_SHA=$CURRENT_MAIN_SHA"
          test "$VALIDATED_SHA" = "$CURRENT_MAIN_SHA"

      - name: Resolve project version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          case "$VERSION" in
            ''|*[!0-9.]*|.*|*.)
              echo "Invalid project version: $VERSION"
              exit 1
              ;;
          esac
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "MVROS_VERSION=$VERSION"
          echo "MVROS_TAG=$TAG"

      - name: Verify tag state
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG_REF="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -z "$TAG_REF" ]; then
            echo "Tag $TAG does not exist and will be created at $VALIDATED_SHA."
            exit 0
          fi

          TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          test -n "$TAG_COMMIT"
          echo "Existing tag $TAG resolves to $TAG_COMMIT"
          test "$TAG_COMMIT" = "$VALIDATED_SHA"
          echo "Existing tag points to the validated SHA."

      - name: Configure release git identity
        run: |
          set -euo pipefail
          git config user.name "lukart-ros-release[bot]"
          git config user.email "lukart-ros-release[bot]@users.noreply.github.com"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG_REF="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -z "$TAG_REF" ]; then
            git tag -a "$TAG" "$VALIDATED_SHA" -m "MVROS $VERSION"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "$VALIDATED_SHA" \
              --title "MVROS $VERSION" \
              --generate-notes
          fi

      - name: Verify release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          echo "REMOTE_TAG_COMMIT=$TAG_COMMIT"
          test "$TAG_COMMIT" = "$VALIDATED_SHA"

          RELEASE_TARGET="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
          echo "RELEASE_TARGET=$RELEASE_TARGET"
          test "$RELEASE_TARGET" = "$VALIDATED_SHA" || test "$RELEASE_TARGET" = "main"
          echo "MVROS v$VERSION release verification complete."
