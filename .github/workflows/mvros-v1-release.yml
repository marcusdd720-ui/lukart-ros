name: MVROS v1 Release

on:
  workflow_run:
    workflows:
      - GitHub App Smoke Test
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: mvros-v1-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release intent
        id: version
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          print(f"version={version}")
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              print("release=true")
              print(f"tag=v{version}")
          else:
              print("release=false")
              print("tag=")
          PY

      - name: Development build — no release mutation
        if: steps.version.outputs.release != 'true'
        run: |
          echo "Project version ${{ steps.version.outputs.version }} is a development version."
          echo "Historical release tags remain unchanged; automatic release is intentionally skipped."

      - name: Verify validated SHA is current main
        if: steps.version.outputs.release == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          echo "VALIDATED_SHA=$VALIDATED_SHA"
          echo "CURRENT_MAIN_SHA=$CURRENT_MAIN_SHA"
          test "$VALIDATED_SHA" = "$CURRENT_MAIN_SHA"

      - name: Require effective main governance for release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main?per_page=100" \
            > /tmp/main-effective-rules.json
          python -m validation.release_governance \
            --rules-json /tmp/main-effective-rules.json

      - name: Require all release validation workflows on the same SHA
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VALIDATED_SHA}&per_page=100" \
            > /tmp/release-workflow-runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          validated_sha = os.environ["VALIDATED_SHA"]
          payload = json.loads(Path("/tmp/release-workflow-runs.json").read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs", [])
          required = (
              "CI Foundation",
              "Architectural Audit 1.0",
              "Stage Gate",
              "Stage Orchestrator",
              "Production Validation Program",
          )
          failures: list[str] = []
          for workflow_name in required:
              candidates = [
                  run for run in runs
                  if run.get("name") == workflow_name and run.get("head_sha") == validated_sha
              ]
              if not candidates:
                  failures.append(f"{workflow_name}: missing for {validated_sha}")
                  continue
              latest = max(
                  candidates,
                  key=lambda run: (run.get("run_number", 0), run.get("run_attempt", 0)),
              )
              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  failures.append(
                      f"{workflow_name}: status={latest.get('status')!r}, "
                      f"conclusion={latest.get('conclusion')!r}"
                  )
          if failures:
              print("Release gate failed:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          print("RELEASE_COMPANION_WORKFLOWS=PASS")
          PY

      - name: Inspect existing release state
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          RELEASE_EXISTS="false"
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi
          echo "TAG_COMMIT=$TAG_COMMIT"
          echo "RELEASE_EXISTS=$RELEASE_EXISTS"
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$VALIDATED_SHA" ]; then
            echo "Release tag $TAG already points to $TAG_COMMIT, not $VALIDATED_SHA."
            echo "Refusing to move an existing release tag. Bump the project version."
            exit 1
          fi
          if [ "$RELEASE_EXISTS" = "true" ] && [ -z "$TAG_COMMIT" ]; then
            echo "Release $TAG exists without a resolvable remote tag; refusing repair."
            exit 1
          fi

      - name: Configure release git identity
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "lukart-ros-release[bot]"
          git config user.email "lukart-ros-release[bot]@users.noreply.github.com"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG_REF="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -z "$TAG_REF" ]; then
            git tag -a "$TAG" "$VALIDATED_SHA" -m "MVROS $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$VALIDATED_SHA" \
              --title "MVROS $VERSION" --generate-notes
          fi

      - name: Verify release state
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          test "$TAG_COMMIT" = "$VALIDATED_SHA"
          RELEASE_TARGET="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
          test "$RELEASE_TARGET" = "$VALIDATED_SHA" || test "$RELEASE_TARGET" = "main"
          echo "Release verification complete."
