name: IRR-01 Independent Review Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  irr01-readiness-package:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation environment
        run: python -m pip install -e ".[dev]"

      - name: Verify exact checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "IRR01_EXACT_SHA=${CANDIDATE_SHA}"

      - name: IRR-01 lint and type-check
        run: |
          ruff check \
            core/independent_review_readiness_v1.py \
            scripts/independent_review_readiness.py \
            tests/test_independent_review_readiness_v1.py
          mypy \
            core/independent_review_readiness_v1.py \
            scripts/independent_review_readiness.py \
            tests/test_independent_review_readiness_v1.py

      - name: IRR-01 focused and adversarial suite
        run: pytest -q tests/test_independent_review_readiness_v1.py

      - name: Build exact-SHA public-only package
        run: |
          rm -rf dist/independent-review
          python scripts/independent_review_readiness.py build \
            --repo-root . \
            --commit "${CANDIDATE_SHA}" \
            --output-dir dist/independent-review

      - name: Verify produced package bytes in a separate step
        shell: bash
        run: |
          package="$(find dist/independent-review -maxdepth 1 -type f -name 'IRR-01-v1-*.zip' -print -quit)"
          test -n "${package}"
          python scripts/independent_review_readiness.py verify --package "${package}"
          sha256sum --check "${package}.sha256"

      - name: External-review authority boundary
        run: |
          echo "IRR01_READINESS_STATUS=READY_FOR_INDEPENDENT_REVIEW"
          echo "IRR01_INDEPENDENT_REVIEW_STATUS=NOT_INDEPENDENTLY_REVIEWED"
          echo "IRR01_AUTOMATION_CAN_CERTIFY=false"
          echo "IRR01_AUTOMATION_CAN_CREATE_REVIEWER_PROVENANCE=false"
