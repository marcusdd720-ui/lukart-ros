name: LRD-01R Revalidation Baseline Selection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-selection:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "17"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"

      - name: Frozen validation environment
        run: uv sync --frozen --extra dev

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "LRD01R_EXACT_SHA=${CANDIDATE_SHA}"

      - name: LRD-01R lint and strict type-check
        run: |
          uv run --frozen --extra dev ruff check \
            core/replay_revalidation_baseline_selection_v1.py \
            tests/test_replay_revalidation_baseline_selection_v1.py
          uv run --frozen --extra dev mypy \
            core/replay_revalidation_baseline_selection_v1.py

      - name: LRD-01R focused selection suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_baseline_selection_v1.py
          -k 'first_selection or reopen or blocked_only or successful_extension or unrelated_stream'

      - name: LRD-01R adversarial selection suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_baseline_selection_v1.py
          -k 'duplicate or rollback or nonprefix or tamper or unknown_event or authority or semantic or stale_race'

      - name: LRD-01R full selection suite
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_baseline_selection_v1.py

      - name: Upstream replay-revalidation regression
        run: >-
          uv run --frozen --extra dev pytest -q
          tests/test_replay_revalidation_baseline_lineage_v1.py
          tests/test_replay_revalidation_baseline_transition_v1.py
          tests/test_replay_revalidation_baseline_v1.py
          tests/test_replay_revalidation_fulfilment_v1.py
          tests/test_replay_revalidation_fulfilment_adversarial_v1.py
          tests/test_replay_revalidation_invalidation_v1.py
          tests/test_periodic_replay_revalidation_v1.py

      - name: Verify authority boundaries remain scoped
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/lrd-01r-revalidation-baseline-selection.yml").read_text()
          module = Path("core/replay_revalidation_baseline_selection_v1.py").read_text()
          workflow_lines = {line.strip() for line in workflow.splitlines()}
          if "schedule:" in workflow_lines:
              raise SystemExit("LRD-01R must not introduce scheduler authority")
          if "contents: write" in workflow_lines or "actions: write" in workflow_lines:
              raise SystemExit("LRD-01R workflow must remain read-only")
          required = (
              '"selection_persistence_authority": True',
              '"mutable_pointer_authority": False',
              '"scheduler_authority": False',
              '"release_authority": False',
              '"product_write_authority": False',
              '"ccl_write_authority": False',
              '"storage_authority": False',
              '"provider_authority": False',
          )
          for marker in required:
              if marker not in module:
                  raise SystemExit(f"missing scoped authority contract: {marker}")
          print("LRD01R_AUTHORITY_BOUNDARY=PASS")
          PY
