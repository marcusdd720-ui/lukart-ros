name: CI Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: MyPy
        run: python -m mypy .
      - name: Pytest
        run: python -m pytest -v
      - name: Synthetic KQM fact-extraction experiment
        run: python -m validation.kqm_experiment
      - name: Repository audit
        if: matrix.python-version == '3.11'
        run: python scripts/repository_audit.py
      - name: PII and confidentiality gate
        if: matrix.python-version == '3.11'
        run: python scripts/pii_scan.py
