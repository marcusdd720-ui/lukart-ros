name: CI Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.10"
      - name: Frozen dependency sync
        run: uv sync --frozen --extra dev
      - name: Lock and PEP 751 consistency gate
        run: |
          uv lock --check
          uv export --format pylock.toml --frozen --all-extras --output-file /tmp/pylock.toml
          diff -u pylock.toml /tmp/pylock.toml
      - name: Dependency boundary gate
        run: uv run --frozen --extra dev python scripts/dependency_boundary_check.py
      - name: Secret-scanning gate
        run: uv run --frozen --extra dev python scripts/secret_scan.py
      - name: PII/confidentiality gate
        run: uv run --frozen --extra dev python scripts/pii_scan.py
      - name: Model usage audit
        run: uv run --frozen --extra dev python scripts/model_usage_audit.py
      - name: Dead-code inventory gate
        run: uv run --frozen --extra dev python scripts/dead_code_gate.py
      - name: Automated quality gate
        run: uv run --frozen --extra dev python -m factory.stage_gate --stage 0
