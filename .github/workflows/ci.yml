name: CI Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Dependency boundary gate
        run: python scripts/dependency_boundary_check.py
      - name: Secret-scanning gate
        run: python scripts/secret_scan.py
      - name: PII/confidentiality gate
        run: python scripts/pii_scan.py
      - name: Model usage audit
        run: python scripts/model_usage_audit.py
      - name: Dead-code inventory gate
        run: python scripts/dead_code_gate.py
      - name: Automated quality gate
        run: python -m factory.stage_gate --stage 0
