name: Production Validation Program

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: lukart-ros-production-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  program-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Collect authenticated human review provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          provenance_dir="${RUNNER_TEMP}/lukart-human-review-provenance"
          python -m validation.github_human_review_provenance \
            --root . \
            --output-dir "${provenance_dir}"
          echo "LUKART_HUMAN_REVIEW_PROVENANCE_DIR=${provenance_dir}" >> "${GITHUB_ENV}"

      - name: Evaluate program until first blocker
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            python -m factory.production_validation_orchestrator
            status=$(python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("factory/production_validation_state.json").read_text())
          print(state["status"])
          PY
          )
            echo "PROGRAM_STATUS=${status}"
            if [[ "${status}" == "BLOCKED" || "${status}" == "COMPLETE" ]]; then
              break
            fi
          done

      - name: Publish program summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from factory.production_validation_orchestrator import production_validation_chain_digest

          state = json.loads(Path("factory/production_validation_state.json").read_text())
          lines = [
              "## Production Validation Program",
              "",
              f"- current step: {state['current_step']}",
              f"- last completed step: {state['last_completed_step']}",
              f"- status: {state['status']}",
              f"- last result: {state['last_result']}",
          ]
          if "block_code" in state:
              lines.append(f"- blocker: {state['block_code']}")
              lines.append(f"- reason: {state['block_reason']}")
          if state["last_completed_step"] >= 19:
              digest, digest_decision = production_validation_chain_digest(Path("."))
              if digest_decision is None and digest is not None:
                  print(f"STEPS_1_19_DIGEST={digest}")
                  lines.append(f"- steps 1-19 digest: `{digest}`")
              else:
                  lines.append("- steps 1-19 digest: unavailable (chain revalidation failed)")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Enforce complete program state
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("factory/production_validation_state.json").read_text())
          status = state.get("status")
          last_completed = state.get("last_completed_step")
          if status != "COMPLETE" or last_completed != 20:
              blocker = state.get("block_code", "INCOMPLETE_PROGRAM")
              reason = state.get("block_reason", "production validation did not complete")
              print(
                  f"Production Validation is not releasable: status={status}, "
                  f"last_completed_step={last_completed}, blocker={blocker}, reason={reason}"
              )
              raise SystemExit(1)
          print("PRODUCTION_VALIDATION_RELEASE_GATE=PASS")
          PY
