name: Enterprise Hardcore Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint Enterprise
        run: >-
          ruff check core/enterprise tests/test_enterprise_track.py
          scripts/enterprise_sbom.py scripts/enterprise_threat_check.py

      - name: Type-check Enterprise
        run: >-
          mypy core/enterprise tests/test_enterprise_track.py
          scripts/enterprise_sbom.py scripts/enterprise_threat_check.py

      - name: Threat-model coverage gate
        run: python scripts/enterprise_threat_check.py

      - name: Enterprise adversarial suite
        run: pytest -q tests/test_enterprise_track.py

      - name: P2/P3 compatibility
        run: >-
          pytest -q tests/test_p2_program.py tests/test_p3_hardcore.py
          tests/test_p3_hardening_boundaries.py tests/test_post_v1_certification.py

      - name: Full regression suite
        run: pytest -q

      - name: Supply-chain pin audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.enterprise.supply_chain import audit_workflow_action_pins

          report = audit_workflow_action_pins(Path('.'))
          print(f"WORKFLOWS_SCANNED={report.scanned_files}")
          print(f"EXTERNAL_ACTION_REFS={report.external_action_references}")
          for finding in report.findings:
              print(f"UNPINNED {finding.path}: {finding.reference} — {finding.reason}")
          if not report.passed:
              raise SystemExit(1)
          print("ENTERPRISE_ACTION_PIN_AUDIT=PASS")
          PY

      - name: Generate resolved-runtime CycloneDX SBOM
        run: python scripts/enterprise_sbom.py

      - name: Upload Enterprise evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-sbom-${{ github.sha }}
          path: build/enterprise/bom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Enterprise policy integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('config/enterprise_v1.json').read_text(encoding='utf-8'))
          assert policy['baseline']['v1_0_1_immutable'] is True
          assert policy['baseline']['locked_gold_mutation_for_pass'] is False
          assert policy['e2_isolation']['separate_process'] is True
          assert policy['e2_isolation']['claims_kernel_or_container_sandbox'] is False
          assert policy['e3_attestation']['algorithm'] == 'Ed25519'
          assert policy['e4_supply_chain']['github_actions_full_sha_required'] is True
          assert policy['e5_authorization']['deny_by_default'] is True
          assert policy['e6_durability']['verified_backup_restore'] is True
          assert policy['e7_observability']['telemetry_is_product_authority'] is False
          assert policy['e8_api']['trusted_state_requires_attestation'] is True
          assert policy['e10_certification']['automated_result_can_claim_independent_certification'] is False
          print('ENTERPRISE_POLICY_INTEGRITY=PASS')
          PY

      - name: Large synthetic scale certification profile
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          from core.enterprise.resilience import EnterpriseScalePlan
          from core.p3.scale import measure_scale_profile

          plan = EnterpriseScalePlan.default()
          measurement = measure_scale_profile(plan.certification)
          print(f"PROFILE={measurement.profile}")
          print(f"DURATION_SECONDS={measurement.duration_seconds:.6f}")
          print(f"PEAK_MEMORY_BYTES={measurement.peak_memory_bytes}")
          print(f"BLAST_RADIUS={measurement.blast_radius_size}")
          print(f"WORK_DIGEST={measurement.work_digest}")
          assert measurement.blast_radius_size == plan.certification.graph_nodes + 1
          PY
