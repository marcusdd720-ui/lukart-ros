name: Enterprise Hardcore Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-gate:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint Enterprise and Hardcore
        run: >-
          ruff check core/enterprise core/p3/contracts.py core/p3/versioning.py
          tests/test_enterprise_track.py tests/test_hardcore_h*.py
          scripts/enterprise_sbom.py scripts/enterprise_threat_check.py scripts/enterprise_certify.py
          scripts/hardcore_h*.py

      - name: Type-check Enterprise and Hardcore
        run: >-
          mypy core/enterprise core/p3/contracts.py core/p3/versioning.py
          tests/test_enterprise_track.py tests/test_hardcore_h*.py
          scripts/enterprise_sbom.py scripts/enterprise_threat_check.py scripts/enterprise_certify.py
          scripts/hardcore_h*.py

      - name: H1 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h1.py

      - name: H1 exact-SHA and immutable baseline integrity
        run: >-
          python scripts/hardcore_h1_validate.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: H2 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h2.py

      - name: H2 live repository policy and required-check integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/hardcore_h2_policy.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: H3 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h3.py

      - name: H4 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h4.py

      - name: H5 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h5.py

      - name: H6 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h6.py

      - name: H7 focused and adversarial suite
        run: pytest -q tests/test_hardcore_h7.py

      - name: Threat-model coverage gate
        run: python scripts/enterprise_threat_check.py

      - name: Enterprise adversarial suite
        run: pytest -q tests/test_enterprise_track.py

      - name: P2/P3 compatibility
        run: >-
          pytest -q tests/test_p2_program.py tests/test_p3_hardcore.py
          tests/test_p3_hardening_boundaries.py tests/test_post_v1_certification.py

      - name: Full regression suite
        run: pytest -q

      - name: Supply-chain pin audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from core.enterprise.supply_chain import audit_workflow_action_pins

          report = audit_workflow_action_pins(Path('.'))
          print(f"WORKFLOWS_SCANNED={report.scanned_files}")
          print(f"EXTERNAL_ACTION_REFS={report.external_action_references}")
          for finding in report.findings:
              print(f"UNPINNED {finding.path}: {finding.reference} — {finding.reason}")
          if not report.passed:
              raise SystemExit(1)
          print("ENTERPRISE_ACTION_PIN_AUDIT=PASS")
          PY

      - name: Generate resolved-runtime and builder CycloneDX SBOM
        run: python scripts/enterprise_sbom.py --extra dev

      - name: Enterprise policy integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('config/enterprise_v1.json').read_text(encoding='utf-8'))
          assert policy['baseline']['v1_0_1_immutable'] is True
          assert policy['baseline']['locked_gold_mutation_for_pass'] is False
          assert policy['e2_isolation']['separate_process'] is True
          assert policy['e2_isolation']['claims_kernel_or_container_sandbox'] is False
          assert policy['e3_attestation']['algorithm'] == 'Ed25519'
          assert policy['e4_supply_chain']['github_actions_full_sha_required'] is True
          assert policy['e5_authorization']['deny_by_default'] is True
          assert policy['e6_durability']['verified_backup_restore'] is True
          assert policy['e7_observability']['telemetry_is_product_authority'] is False
          assert policy['e8_api']['trusted_state_requires_attestation'] is True
          assert policy['e10_certification']['automated_result_can_claim_independent_certification'] is False
          assert policy['h2_repository_policy']['strict_required_status_checks'] is True
          assert policy['h2_repository_policy']['allowed_bypass_actors'] == []
          required = {item['context'] for item in policy['h2_repository_policy']['required_checks']}
          assert 'enterprise-gate' in required
          assert 'codeql' in required
          h3 = policy['h3_supply_chain_provenance']
          assert h3['schema'] == 'lukart.hardcore.h3-provenance.v1'
          assert h3['dependency_groups'] == ['runtime', 'dev']
          assert h3['exact_source_sha_required'] is True
          assert h3['full_sha_actions_required'] is True
          assert h3['material_mismatch'] == 'FAIL'
          assert h3['external_slsa_certification_claimed'] is False
          h4 = policy['h4_capability_isolation']
          assert h4['schema'] == 'lukart.hardcore.h4-capability-isolation.v1'
          assert h4['python_audit_hook_capability_guard'] is True
          assert h4['filesystem_mode'] == 'explicit-read-roots-workspace-write-only'
          assert h4['deny_process_spawn_by_default'] is True
          assert h4['deny_native_ffi_by_default'] is True
          assert h4['deny_network_when_policy_denies'] is True
          assert h4['unknown_capability'] == 'FAIL'
          assert h4['kernel_or_container_sandbox_claimed'] is False
          h5 = policy['h5_replay_migration']
          assert h5['schema'] == 'lukart.hardcore.h5-replay-migration.v1'
          assert h5['runtime_identity_schema'] == 'lukart.runtime-identity.v2'
          assert h5['complete_identity_required_for_identical'] is True
          assert h5['provider_plugin_versions_required'] is True
          assert h5['input_evidence_digests_required'] is True
          assert h5['explicit_cross_version_migration_required'] is True
          assert h5['unknown_migration_path'] == 'FAIL'
          assert h5['ambiguous_migration_path'] == 'FAIL'
          assert h5['semantic_divergence_visible'] is True
          h6 = policy['h6_authorization_isolation']
          assert h6['schema'] == 'lukart.hardcore.h6-authorization-isolation.v1'
          assert h6['strict_api_version'] == '1.1.0'
          assert h6['tenant_scope'] == 'DENY_UNDECLARED'
          assert h6['case_scope'] == 'DENY_UNDECLARED'
          assert h6['workspace_scope'] == 'DENY_UNDECLARED'
          assert h6['request_resource_binding_required'] is True
          assert h6['nonce_replay_protection_required'] is True
          assert h6['trust_promotion_requires_security_review'] is True
          assert h6['legacy_trust_promotion'] == 'DENY'
          h7 = policy['h7_recovery_rollback']
          assert h7['schema'] == 'lukart.hardcore.h7-recovery-rollback.v1'
          assert h7['recovery_identity_schema'] == 'lukart.recovery-identity.v1'
          assert h7['atomic_batch_persistence'] is True
          assert h7['staged_restore_before_replace'] is True
          assert h7['provenance_identity_required'] is True
          assert h7['semantic_identity_required'] is True
          assert h7['max_restore_records'] >= 10000
          assert h7['corrupt_snapshot'] == 'FAIL'
          assert h7['blast_radius_breach'] == 'FAIL'
          assert h7['silent_partial_recovery'] is False
          print('ENTERPRISE_POLICY_INTEGRITY=PASS')
          PY

      - name: Large synthetic scale certification profile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from core.enterprise.resilience import EnterpriseScalePlan
          from core.p3.scale import ScaleBudget, certify_scale, measure_scale_profile

          plan = EnterpriseScalePlan.default()
          measurement = measure_scale_profile(plan.certification)
          budget = ScaleBudget(
              max_duration_seconds=120.0,
              max_peak_memory_bytes=1_073_741_824,
              min_cache_hit_ratio=0.01,
          )
          certification = certify_scale(measurement, budget)
          payload = {
              'profile': measurement.profile,
              'duration_seconds': measurement.duration_seconds,
              'peak_memory_bytes': measurement.peak_memory_bytes,
              'work_digest': measurement.work_digest,
              'cache_hits': measurement.cache_hits,
              'cache_misses': measurement.cache_misses,
              'cache_hit_ratio': measurement.cache_hit_ratio,
              'blast_radius_size': measurement.blast_radius_size,
              'budget': {
                  'max_duration_seconds': budget.max_duration_seconds,
                  'max_peak_memory_bytes': budget.max_peak_memory_bytes,
                  'min_cache_hit_ratio': budget.min_cache_hit_ratio,
              },
              'passed': certification.passed,
              'failures': list(certification.failures),
          }
          output = Path('build/enterprise/scale-certification.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f"PROFILE={measurement.profile}")
          print(f"DURATION_SECONDS={measurement.duration_seconds:.6f}")
          print(f"PEAK_MEMORY_BYTES={measurement.peak_memory_bytes}")
          print(f"CACHE_HIT_RATIO={measurement.cache_hit_ratio:.6f}")
          print(f"BLAST_RADIUS={measurement.blast_radius_size}")
          print(f"WORK_DIGEST={measurement.work_digest}")
          if measurement.blast_radius_size != plan.certification.graph_nodes + 1:
              raise SystemExit('Enterprise blast-radius scale contract failed')
          if not certification.passed:
              raise SystemExit(f"Enterprise scale budget failed: {certification.failures}")
          print('ENTERPRISE_SCALE_CERTIFICATION=PASS')
          PY

      - name: Build exact-SHA E10 engineering evidence
        run: >-
          python scripts/enterprise_certify.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: H3 exact-SHA supply-chain provenance closure
        run: >-
          python scripts/hardcore_h3_provenance.py
          --candidate-sha "${CANDIDATE_SHA}"
          --repository "${GITHUB_REPOSITORY}"
          --workflow-ref "${GITHUB_WORKFLOW_REF}"
          --workflow-sha "${GITHUB_WORKFLOW_SHA}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --runner-os "${RUNNER_OS}"
          --runner-arch "${RUNNER_ARCH}"

      - name: H4 exact-SHA capability isolation closure
        run: >-
          python scripts/hardcore_h4_isolation.py
          --candidate-sha "${CANDIDATE_SHA}"
          --runner-os "${RUNNER_OS}"

      - name: H5 exact-SHA replay migration closure
        run: >-
          python scripts/hardcore_h5_replay.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: H6 exact-SHA authorization isolation closure
        run: >-
          python scripts/hardcore_h6_authorization.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: H7 exact-SHA recovery rollback closure
        run: >-
          python scripts/hardcore_h7_recovery.py
          --candidate-sha "${CANDIDATE_SHA}"

      - name: Upload Enterprise and H1-H7 evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/hardcore/h1-baseline-evidence.json
            build/hardcore/h2-repository-policy-evidence.json
            build/hardcore/h3-supply-chain-provenance.json
            build/hardcore/h4-capability-isolation.json
            build/hardcore/h5-replay-migration.json
            build/hardcore/h6-authorization-isolation.json
            build/hardcore/h7-recovery-rollback.json
            build/enterprise/bom.cdx.json
            build/enterprise/scale-certification.json
            build/enterprise/enterprise-engineering-evidence.json
          if-no-files-found: error
          retention-days: 30
