schema_version: night-shift-executor-registry/v1
executors:
  - executor_id: deterministic_local
    capabilities: [git, deterministic_validation]
    mutating: false
    independent_review: true
    cost_rank: 0
    enabled: true
    requires_local_writer: true
    heavy_compute: false
    max_parallel: 1
  - executor_id: codex_adapter
    capabilities: [git, bounded_code_change, bounded_code_remediation]
    mutating: true
    independent_review: false
    cost_rank: 1
    enabled: true
    requires_local_writer: false
    heavy_compute: false
    max_parallel: 2
  - executor_id: independent_reviewer
    capabilities: [git, review]
    mutating: false
    independent_review: true
    cost_rank: 1
    enabled: true
    requires_local_writer: false
    heavy_compute: false
    max_parallel: 2
